<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noteプレビュー 埋め込みテスト</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; margin: 0; padding: 20px;
         background: #f2f2f5; color: #1a1a1c; line-height: 1.7; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 14px; }
  p { font-size: 14px; margin: 0 0 14px; }
  input { width: 100%; padding: 11px; font-size: 14px; border: 1px solid #c9c9d0;
          border-radius: 9px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 12px 20px; border: 0; border-radius: 10px;
           background: #0a84ff; color: #fff; font-size: 15px; font-weight: 700; }
  .frame { margin-top: 18px; border: 2px dashed #b9b9c2; border-radius: 12px;
           overflow: hidden; background: #fff; height: 70vh; }
  iframe { width: 100%; height: 100%; border: 0; }
  .verdict { margin-top: 14px; padding: 12px 14px; border-radius: 10px;
             font-size: 14px; font-weight: 700; background: #ececf0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>noteプレビューの埋め込みテスト</h1>
  <p>下の枠に記事が表示されれば埋め込みできます。<br>
     <b>真っ白のまま／エラーが出る</b>場合は、note側が埋め込みを拒否しています。</p>

  <input id="u" placeholder="noteのプレビューURLを貼る">
  <button id="go">枠に読み込む</button>

  <div class="frame"><iframe id="f" title="preview"></iframe></div>
  <div class="verdict" id="v">URLを貼って「枠に読み込む」を押してください。</div>
</div>

<script>
  var f = document.getElementById('f');
  var v = document.getElementById('v');

  document.getElementById('go').addEventListener('click', function () {
    var url = document.getElementById('u').value.trim();
    if (!url) return;
    v.textContent = '読み込み中…（10秒ほど待ってから枠を見てください）';
    f.src = url;
  });

  // 埋め込みが拒否されると load は起きるが中身が読めない、という状態になる
  f.addEventListener('load', function () {
    if (!f.src) return;
    var ok = false;
    try { ok = !!(f.contentWindow && f.contentWindow.location.href); } catch (e) { ok = true; }
    v.textContent = ok
      ? '枠に記事が出ていれば「埋め込みOK」です。真っ白ならNGです。'
      : '枠が空のままなら、note側が埋め込みを拒否しています（NG）。';
  });
</script>
</body>
</html>
